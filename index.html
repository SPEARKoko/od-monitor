<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OD 监测</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body { font-family: sans-serif; margin: 16px; background: #fafafa; color: #222; }
  #wrap { max-width: 900px; margin: auto; }
  #login { margin-top: 40px; text-align: center; }
  input[type=password] { font-size: 16px; padding: 8px; width: 220px; }
  button { font-size: 16px; padding: 8px 16px; margin-left: 6px; }
  #msg { color: #c00; margin-top: 10px; min-height: 1.2em; }
  #main { display: none; }
  #status { margin: 8px 0 12px; line-height: 1.7; }
  .good { color: #0a7d32; font-weight: bold; }
  .warn { color: #b26a00; font-weight: bold; }
  .bad  { color: #c00; font-weight: bold; }
</style>
</head>
<body>
<div id="wrap">
  <h2>OD 监测 · 稳定性测试</h2>

  <div id="login">
    <p>请输入密码查看数据</p>
    <input type="password" id="pw" placeholder="密码">
    <button id="go">进入</button>
    <div id="msg"></div>
  </div>

  <div id="main">
    <div id="status"></div>
    <button id="refresh">刷新数据</button>
    <canvas id="chart" style="margin-top:12px"></canvas>
  </div>
</div>

<script>
let password = null;
let chart = null;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

// 解密（与 uploader.py 对应：PBKDF2-SHA256 + AES-GCM）
async function decrypt(obj, pw) {
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(obj.salt), iterations: obj.iter, hash: 'SHA-256' },
    material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(obj.iv) }, key, b64(obj.data));
  return new TextDecoder().decode(plain);
}

// 按表头名字读取各列
function parseCsv(text) {
  const lines = text.trim().split('\n');
  const head = lines[0].split(',');
  const rows = lines.slice(1).map(l => {
    const p = l.split(','), r = {};
    head.forEach((h, i) => r[h] = (h === 'time') ? p[i] : parseFloat(p[i]));
    return r;
  });
  return rows;
}

async function loadData() {
  const res = await fetch('data.enc.json?t=' + Date.now());
  if (!res.ok) throw new Error('读取数据文件失败（' + res.status + '）');
  const obj = await res.json();
  let text;
  try { text = await decrypt(obj, password); }
  catch (e) { throw new Error('密码错误'); }
  const rows = parseCsv(text);
  if (!rows.length || !('diff_mean' in rows[0])) throw new Error('还没有新格式的数据，请等第一次测量完成');
  return rows;
}

function cvClass(cv) {
  if (cv < 0.5) return 'good';
  if (cv < 2) return 'warn';
  return 'bad';
}

function draw(rows) {
  const last = rows[rows.length - 1];
  document.getElementById('status').innerHTML =
    '最新时间：' + last.time +
    '<br>暗电压：' + last.v_off.toFixed(4) + ' V' +
    '<br>三次信号：' + last.diff1.toFixed(4) + ' / ' + last.diff2.toFixed(4) + ' / ' + last.diff3.toFixed(4) + ' V' +
    '<br>平均：<b>' + last.diff_mean.toFixed(4) + ' V</b>　标准差：' + (last.diff_sd * 1000).toFixed(2) + ' mV' +
    '　CV：<span class="' + cvClass(last.cv_percent) + '">' + last.cv_percent.toFixed(2) + '%</span>' +
    ('temp_c' in last ? '<br>芯片温度：' + last.temp_c.toFixed(1) + ' °C' : '') +
    '<br>共 ' + rows.length + ' 个测量点';

  const labels = rows.map(r => r.time.slice(5, 16));   // 显示 月-日 时:分
  const pts = k => rows.map(r => r[k]);
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        { label: '平均信号', data: pts('diff_mean'), borderWidth: 2, pointRadius: 0, borderColor: '#1f6fd1' },
        { label: '读数 1', data: pts('diff1'), showLine: false, pointRadius: 3, borderColor: '#e07b00', backgroundColor: '#e07b00' },
        { label: '读数 2', data: pts('diff2'), showLine: false, pointRadius: 3, borderColor: '#2a9d4b', backgroundColor: '#2a9d4b' },
        { label: '读数 3', data: pts('diff3'), showLine: false, pointRadius: 3, borderColor: '#9b3bd1', backgroundColor: '#9b3bd1' }
      ].concat('temp_c' in rows[0] ? [
        { label: '温度 (°C)', data: pts('temp_c'), yAxisID: 'y1', borderWidth: 1.5, pointRadius: 0,
          borderColor: '#d14b4b', borderDash: [5, 4] }
      ] : [])
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { title: { display: true, text: '时间' }, ticks: { maxTicksLimit: 8 } },
        y: { title: { display: true, text: '信号：开灯 − 暗电压 (V)' } },
        y1: { display: 'temp_c' in rows[0], position: 'right',
              title: { display: true, text: '温度 (°C)' }, grid: { drawOnChartArea: false } }
      }
    }
  });
}

async function enter() {
  const msg = document.getElementById('msg');
  msg.textContent = '解密中...';
  password = document.getElementById('pw').value;
  try {
    const rows = await loadData();
    document.getElementById('login').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    draw(rows);
  } catch (e) {
    msg.textContent = e.message;
    if (e.message === '密码错误') password = null;
  }
}

document.getElementById('go').onclick = enter;
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
document.getElementById('refresh').onclick = async () => {
  try { draw(await loadData()); } catch (e) { alert(e.message); }
};
</script>
</body>
</html>
